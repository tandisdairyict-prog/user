<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پورتال سازمانی{% endblock %}</title>

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Vazirmatn Persian Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'org_chart/css/org_chart.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="portal-body">

<!-- Top Navbar -->
<nav class="navbar navbar-expand-lg portal-navbar fixed-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/org/">
            <div class="brand-icon">
                <i class="bi bi-diagram-3-fill"></i>
            </div>
            <div>
                <div class="brand-title">پورتال سازمانی</div>
                <div class="brand-subtitle">Enterprise Portal</div>
            </div>
        </a>

        <div class="navbar-nav me-auto d-none d-lg-flex flex-row gap-1">
            <a class="nav-link px-3 {% block nav_chart %}{% endblock %}" href="/org/">
                <i class="bi bi-diagram-3 me-1"></i> نمودار سازمانی
            </a>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-icon" id="darkModeToggle" title="حالت تاریک">
                <i class="bi bi-moon-fill"></i>
            </button>
            <div class="navbar-divider"></div>
            <div class="dropdown">
                <button class="btn btn-sm d-flex align-items-center gap-2 user-menu-btn" data-bs-toggle="dropdown">
                    <div class="user-avatar-sm">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="d-none d-md-block text-start">
                        <div class="user-name-sm">مدیر سیستم</div>
                        <div class="user-role-sm">Administrator</div>
                    </div>
                    <i class="bi bi-chevron-down small"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-start">
                    <li><a class="dropdown-item" href="/admin/"><i class="bi bi-gear me-2"></i>پنل مدیریت</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="/admin/logout/"><i class="bi bi-box-arrow-right me-2"></i>خروج</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="portal-main">
    {% block content %}{% endblock %}
</main>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index:9999">
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Dark mode
(function() {
    const saved = localStorage.getItem('portalDarkMode');
    if (saved === 'true') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();

document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('darkModeToggle');
    if (toggle) {
        toggle.addEventListener('click', function() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('portalDarkMode', 'false');
                toggle.querySelector('i').className = 'bi bi-moon-fill';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('portalDarkMode', 'true');
                toggle.querySelector('i').className = 'bi bi-sun-fill';
            }
        });
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            toggle.querySelector('i').className = 'bi bi-sun-fill';
        }
    }
});

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const id = 'toast_' + Date.now();
    const icons = { success: 'check-circle-fill', error: 'x-circle-fill', warning: 'exclamation-triangle-fill', info: 'info-circle-fill' };
    const colors = { success: 'text-success', error: 'text-danger', warning: 'text-warning', info: 'text-info' };
    const html = `
        <div id="${id}" class="toast align-items-center border-0 shadow-lg" role="alert" data-bs-autohide="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-${icons[type] || icons.info} ${colors[type] || colors.info} fs-5"></i>
                    <span>${message}</span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>`;
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(id);
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
    toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
}
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
